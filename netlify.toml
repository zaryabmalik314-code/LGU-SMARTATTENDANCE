# Netlify config for lgusmartattendanc.netlify.app (no trailing "e" — the
# current site, and the origin the shipped TWA loads). The older
# lgusmartattendance.netlify.app site is superseded; both are kept in
# ALLOWED_ORIGINS and assetlinks.json so already-installed APKs keep working.
# The repo root is the site root, so /index.html, /manifest.json, /push-sw.js,
# /SmartAttend.apk and /.well-known/assetlinks.json are all served at the domain root.
[build]
  publish = "."

# Digital Asset Links MUST be served as application/json or the Android TWA
# won't verify (and the app would show a URL bar).
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

# Serve the APK as a proper Android package download.
[[headers]]
  for = "/SmartAttend.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"SmartAttend.apk\""
